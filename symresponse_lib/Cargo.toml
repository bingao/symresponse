[package]
name = "symresponse_lib"
version = "0.1.0"
edition = "2024"

[dependencies]
num-rational = { version = "0.4", features = ["serde"] }
rayon = "1.10.0"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tinned = { workspace = true }

[lib]
name = "symresponse"
path = "src/lib.rs"
